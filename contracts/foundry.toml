[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Robinhood Chain is an Arbitrum Nitro chain; Shanghai is the conservative
# target every ArbOS release in circulation executes.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 2000
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC}"
