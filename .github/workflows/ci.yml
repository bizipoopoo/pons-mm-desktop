name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend build
        run: npm --prefix frontend run build
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...

  secrets:
    runs-on: ubuntu-latest
    # Dependabot-triggered runs get a minimal read-only token; gitleaks-action
    # lists the PR's commits, so it needs pull-requests: read declared
    # explicitly or those runs fail with 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
