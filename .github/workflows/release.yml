name: Release desktop apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  WAILS_VERSION: v2.14.0

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build universal macOS application
        run: wails build -clean -trimpath -platform darwin/universal -o PonsDesk
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/PonsDesk.app PonsDesk-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: PonsDesk-macOS-universal.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${env:WAILS_VERSION}
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build Windows application and installer
        run: wails build -clean -trimpath -platform windows/amd64 -nsis -o PonsDesk.exe
      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Get-ChildItem build/bin -Filter *.exe | Copy-Item -Destination release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
