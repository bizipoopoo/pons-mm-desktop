<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="154" y1="118" x2="866" y2="914" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#182127"/>
      <stop offset="0.55" stop-color="#111719"/>
      <stop offset="1" stop-color="#0A1012"/>
    </linearGradient>
    <linearGradient id="mark" x1="290" y1="764" x2="774" y2="260" gradientUnits="userSpaceOnUse">
